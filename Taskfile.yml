# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GREETING: Hello, world!

tasks:
  default:
    desc: Show this Help page
    cmds:
      - task help
    silent: true

  help:
    desc: Show this Help page
    cmds:
      - task --list
    silent: true

  run:
    desc: Run restro
    cmds:
      - go run ./cmd/main.go
    silent: true

  db:up:
    desc: Start the database
    cmds:
      - docker compose -f docker/docker-compose.db.yaml up -d
    silent: true

  db:down:
    desc: Stop the database
    cmds:
      - docker compose -f docker/docker-compose.db.yaml down
    silent: true

  run:docker:
    desc: Build and run via Docker compose
    cmds:
      - docker compose up --build
    silent: true

  stop:docker:
    desc: Stop Docker compose services
    cmds:
      - docker compose down
    silent: true

  logs:
    desc: Tail Docker compose logs
    cmds:
      - docker compose logs -f --tail=100
    silent: true

  deploy:
    desc: Build and start the full stack on the VPS
    cmds:
      - docker compose up --build -d
    silent: true
