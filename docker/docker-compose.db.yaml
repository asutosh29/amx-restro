services:
  restro_db:
    image: mysql:8.0
    container_name: restrodb_container
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: restro_test
      MYSQL_USER: restro
      MYSQL_PASSWORD: pass_word
      MYSQL_ROOT_PASSWORD: pass_word
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
