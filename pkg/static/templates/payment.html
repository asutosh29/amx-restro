<!DOCTYPE html>
<html lang="en">

<head>
    {{ template "Head" .}}
    <title>Restro | Payment</title>
</head>

<body>
    {{ template "Navbar" .}}
    {{ template "popup" .}}
    <div class="app-shell">
        <main class="container app-page">
            <section class="app-section app-payment-card p-4 p-lg-5 text-center">
                <div class="app-page-header mb-4">
                    <h1 class="app-page-title">Order placed successfully</h1>
                    <p class="app-page-subtitle">Your order is confirmed and has been sent to the team.</p>
                </div>
                <div class="row g-3 justify-content-center mb-4">
                    <div class="col-sm-6">
                        <div class="app-panel-muted p-3">
                            <p class="app-kv-label mb-1">Order ID</p>
                            <p class="app-kv-value mb-0">{{ .OrderID }}</p>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="app-panel-muted p-3">
                            <p class="app-kv-label mb-1">Table ID</p>
                            <p class="app-kv-value mb-0">{{ .TableID }}</p>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-wrap justify-content-center gap-3">
                    <a class="btn btn-primary" href="/user/orders">Check Your Orders</a>
                    <a class="btn btn-outline-secondary" href="/menu">Create New Order</a>
                </div>
            </section>
        </main>
    </div>
    {{ template "Bootstrap" .}}
</body>

</html>
