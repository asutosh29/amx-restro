{{define "popup"}}
<div class="app-floating-alerts position-fixed">

        {{template "popupCore" .}}

</div>
{{end}}

{{define "popupCore"}}
{{$message := .Popup.Msg}} {{$isError := .Popup.IsError}}
{{if $isError}}
<div class="alert alert-danger alert-dismissible fade show col-12 mx-auto mb-0" role="alert">
    <strong>Error!</strong> {{$message}} 
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{{else if ne $message ""}}
<div class="alert alert-success alert-dismissible fade show col-12 mx-auto mb-0" role="alert">
    {{$message}}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{{end}}
{{end}}
