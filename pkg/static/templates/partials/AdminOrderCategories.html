{{ define "AdminOrderCategories" }}
<div class="app-toolbar">
    <div class="app-toolbar-group">
        {{ $catg := .Category }}
        {{ range .Categories}}
        <form class="app-pill-form" action="/admin/orders" method="get">
            <input type="hidden" name="category" value="{{ . }}">
            {{ if eq . $catg}}
            <button type="submit" class="btn app-pill active">
                {{ . }}
            </button>
            {{else}}
            <button type="submit" class="btn app-pill">
                {{ . }}
            </button>
            {{end}}
        </form>
        {{end}}
    </div>
</div>
{{ end }}
