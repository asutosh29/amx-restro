{{define "Categories"}}
<div class="app-toolbar">
    <div class="app-toolbar-group">
        {{ $catg := .Category }}
        {{ range .Categories}}
        <form class="app-pill-form" action="/menu" method="get">
            <input type="hidden" name="category" value="{{ . }}">
            {{ if eq . $catg}}
            <button type="submit" class="btn app-pill active">
                {{ . }}
            </button>
            {{else}}
            <button type="submit" class="btn app-pill">
                {{ . }}
            </button>
            {{end}}
        </form>
        {{end}}
    </div>
    <form class="d-flex gap-2 app-search" role="search" action="/menu" method="get">
            <input class="form-control" type="search" placeholder="Search" aria-label="Search" name="search" />
            <button class="btn btn-primary" type="submit">Search</button>
    </form>
</div>
{{end}}
