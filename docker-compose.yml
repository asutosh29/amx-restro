services:
  restro_db:
    image: mysql:8.0
    container_name: restrodb_container
    environment:
      MYSQL_ROOT_PASSWORD: root
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  restro_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: restro_container
    ports:
      - 8000:8000
    env_file: .env
    depends_on:
      restro_db:
        condition: service_healthy

volumes:
  mysql_data:
